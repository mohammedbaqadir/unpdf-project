<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">One PDF through ordered refusals</title>
  <desc id="flow-desc">A vertical sequence: read words, check page count, page size, anchors, the family match rule, extract and validate fields, then store. Each check either passes or exits to the right as failed, quarantined, reviewed, or skipped as a duplicate. Stored documents end in the database and the evidence folder.</desc>

  <rect width="960" height="540" fill="#fffdf8"></rect>

  <text x="80" y="46" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#a8532f">THE SPINE — FIRST FAILURE WINS</text>
  <text x="420" y="46" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#5d6b68">WHAT IS RECORDED INSTEAD</text>

  <rect x="80" y="66" width="300" height="44" rx="8" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="94" y="86" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">read words</text>
  <text x="94" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">text layer, else Tesseract 300 DPI</text>

  <rect x="80" y="122" width="300" height="44" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="94" y="142" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">page count</text>
  <text x="94" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">count must equal the profile</text>

  <rect x="80" y="178" width="300" height="44" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="94" y="198" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">page size</text>
  <text x="94" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">relative tolerance, default 0.02</text>

  <rect x="80" y="234" width="300" height="44" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="94" y="254" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">anchors</text>
  <text x="94" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">every token inside its box</text>

  <rect x="80" y="290" width="300" height="44" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="94" y="310" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">match rule</text>
  <text x="94" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">exactly one contract, for a family</text>

  <rect x="80" y="346" width="300" height="44" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="94" y="366" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">extract and validate</text>
  <text x="94" y="382" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">centres in boxes, then the kind check</text>

  <rect x="80" y="402" width="300" height="44" rx="8" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="94" y="422" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">store</text>
  <text x="94" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">one row per field, plus evidence</text>

  <line x1="230" y1="110" x2="230" y2="122" stroke="#5d6b68" stroke-width="1.4"></line>
  <line x1="230" y1="166" x2="230" y2="178" stroke="#5d6b68" stroke-width="1.4"></line>
  <line x1="230" y1="222" x2="230" y2="234" stroke="#5d6b68" stroke-width="1.4"></line>
  <line x1="230" y1="278" x2="230" y2="290" stroke="#5d6b68" stroke-width="1.4"></line>
  <line x1="230" y1="334" x2="230" y2="346" stroke="#5d6b68" stroke-width="1.4"></line>
  <line x1="230" y1="390" x2="230" y2="402" stroke="#5d6b68" stroke-width="1.4"></line>
  <path d="M 230 122 L 225 114 L 235 114 Z" fill="#5d6b68"></path>
  <path d="M 230 178 L 225 170 L 235 170 Z" fill="#5d6b68"></path>
  <path d="M 230 234 L 225 226 L 235 226 Z" fill="#5d6b68"></path>
  <path d="M 230 290 L 225 282 L 235 282 Z" fill="#5d6b68"></path>
  <path d="M 230 346 L 225 338 L 235 338 Z" fill="#5d6b68"></path>
  <path d="M 230 402 L 225 394 L 235 394 Z" fill="#5d6b68"></path>

  <line x1="380" y1="88" x2="420" y2="88" stroke="#5d6b68" stroke-width="1.4"></line>
  <path d="M 420 88 L 412 84 L 412 92 Z" fill="#5d6b68"></path>
  <line x1="380" y1="144" x2="420" y2="144" stroke="#a8532f" stroke-width="1.4"></line>
  <path d="M 420 144 L 412 140 L 412 148 Z" fill="#a8532f"></path>
  <line x1="380" y1="200" x2="420" y2="200" stroke="#a8532f" stroke-width="1.4"></line>
  <path d="M 420 200 L 412 196 L 412 204 Z" fill="#a8532f"></path>
  <line x1="380" y1="256" x2="420" y2="256" stroke="#a8532f" stroke-width="1.4"></line>
  <path d="M 420 256 L 412 252 L 412 260 Z" fill="#a8532f"></path>
  <line x1="380" y1="312" x2="420" y2="312" stroke="#a8532f" stroke-width="1.4"></line>
  <path d="M 420 312 L 412 308 L 412 316 Z" fill="#a8532f"></path>
  <line x1="380" y1="368" x2="420" y2="368" stroke="#0f6b62" stroke-width="1.4"></line>
  <path d="M 420 368 L 412 364 L 412 372 Z" fill="#0f6b62"></path>
  <line x1="380" y1="424" x2="420" y2="424" stroke="#5d6b68" stroke-width="1.4"></line>
  <path d="M 420 424 L 412 420 L 412 428 Z" fill="#5d6b68"></path>

  <rect x="420" y="70" width="280" height="36" rx="6" fill="#ece4d5" stroke="#bdb3a1"></rect>
  <text x="432" y="85" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#5d6b68">EXIT 3 · FAILED</text>
  <text x="432" y="99" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">the file cannot be opened or read</text>

  <rect x="420" y="126" width="280" height="36" rx="6" fill="#f1e4d4" stroke="#a8532f"></rect>
  <text x="432" y="141" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#a8532f">EXIT 4 · QUARANTINE</text>
  <text x="432" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">expected N pages, found M</text>

  <rect x="420" y="182" width="280" height="36" rx="6" fill="#f1e4d4" stroke="#a8532f"></rect>
  <text x="432" y="197" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#a8532f">EXIT 4 · QUARANTINE</text>
  <text x="432" y="211" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">geometry differs from the profile</text>

  <rect x="420" y="238" width="280" height="36" rx="6" fill="#f1e4d4" stroke="#a8532f"></rect>
  <text x="432" y="253" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#a8532f">EXIT 4 · QUARANTINE</text>
  <text x="432" y="267" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">an anchor token is not in its box</text>

  <rect x="420" y="294" width="280" height="36" rx="6" fill="#f1e4d4" stroke="#a8532f"></rect>
  <text x="432" y="309" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#a8532f">EXIT 4 · QUARANTINE</text>
  <text x="432" y="323" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">no member matched, or more than one</text>

  <rect x="420" y="350" width="280" height="36" rx="6" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="432" y="365" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#0f6b62">EXIT 2 · REVIEW</text>
  <text x="432" y="379" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">a value failed its kind check</text>

  <rect x="420" y="406" width="280" height="36" rx="6" fill="#ece4d5" stroke="#bdb3a1"></rect>
  <text x="432" y="421" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#5d6b68">SKIPPED · SAME SHA-256</text>
  <text x="432" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#1d2b2a">already stored in this database</text>

  <rect x="714" y="70" width="214" height="120" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="728" y="92" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">The batch survives itself</text>
  <text x="728" y="112" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">A failure is written down and</text>
  <text x="728" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">the next file runs. A quarantine</text>
  <text x="728" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">is a record, not an exception.</text>
  <text x="728" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">Duplicate file names stop the</text>
  <text x="728" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">batch first: exit 1, nothing read.</text>

  <rect x="714" y="206" width="214" height="86" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="728" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">Names route nothing</text>
  <text x="728" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">Page geometry, anchors, and</text>
  <text x="728" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">the match value choose a</text>
  <text x="728" y="276" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">family member. Never the name.</text>

  <rect x="714" y="308" width="214" height="98" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="728" y="330" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">One contract per file</text>
  <text x="728" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">The contract is chosen before</text>
  <text x="728" y="364" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">any field is read. Fields are</text>
  <text x="728" y="378" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">never borrowed from a second</text>
  <text x="728" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">profile to fill a gap.</text>

  <line x1="230" y1="446" x2="230" y2="464" stroke="#0f6b62" stroke-width="1.4"></line>
  <line x1="152" y1="464" x2="308" y2="464" stroke="#0f6b62" stroke-width="1.4"></line>
  <line x1="152" y1="464" x2="152" y2="476" stroke="#0f6b62" stroke-width="1.4"></line>
  <line x1="308" y1="464" x2="308" y2="476" stroke="#0f6b62" stroke-width="1.4"></line>
  <path d="M 152 476 L 148 469 L 156 469 Z" fill="#0f6b62"></path>
  <path d="M 308 476 L 304 469 L 312 469 Z" fill="#0f6b62"></path>

  <rect x="80" y="478" width="150" height="42" rx="8" fill="#fffdf8" stroke="#0f6b62"></rect>
  <text x="92" y="496" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1d2b2a">&lt;name&gt;.db</text>
  <text x="92" y="510" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">fields · statuses · quarantine</text>

  <rect x="248" y="478" width="132" height="42" rx="8" fill="#fffdf8" stroke="#0f6b62"></rect>
  <text x="260" y="496" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1d2b2a">.unpdf/</text>
  <text x="260" y="510" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">snapshot · evidence</text>

  <text x="420" y="496" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">Both live beside the PDFs, never inside the</text>
  <text x="420" y="510" font-family="system-ui, sans-serif" font-size="10" fill="#5d6b68">tool's own folder. Neither crosses the boundary.</text>
</svg>
