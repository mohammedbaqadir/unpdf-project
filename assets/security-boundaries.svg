<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="sec-title sec-desc">
  <title id="sec-title">From a credential to a verified request</title>
  <desc id="sec-desc">An environment pair and a credentials file both feed one loader, which enforces that a URL and a token come from the same source and refuses redirects. The loader produces a bearer header that crosses to the Worker. The Worker compares the admin token in constant time against a secret, and hashes a user token with a pepper before looking it up in D1; a revoked or unknown row returns 401.</desc>

  <rect width="960" height="540" fill="#fffdf8"></rect>

  <text x="44" y="44" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#a8532f">THIS MACHINE</text>
  <text x="560" y="44" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#a8532f">CLOUDFLARE</text>

  <rect x="44" y="64" width="390" height="70" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="58" y="86" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">Environment pair</text>
  <text x="58" y="104" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#5d6b68">UNPDF_REGISTRY_URL + UNPDF_REGISTRY_TOKEN</text>
  <text x="58" y="122" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">both set, or neither</text>

  <rect x="44" y="150" width="390" height="70" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="58" y="172" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">Credentials file</text>
  <text x="58" y="190" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#5d6b68">~/.config/unpdf/credentials.json</text>
  <text x="58" y="208" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">a url and a token, in one file</text>

  <path d="M 44 99 L 30 99 L 30 236 L 239 236" fill="none" stroke="#5d6b68" stroke-width="1.3"></path>
  <line x1="239" y1="220" x2="239" y2="236" stroke="#5d6b68" stroke-width="1.3"></line>
  <line x1="239" y1="236" x2="239" y2="250" stroke="#5d6b68" stroke-width="1.3"></line>
  <path d="M 239 250 L 234 242 L 244 242 Z" fill="#5d6b68"></path>

  <rect x="44" y="250" width="390" height="76" rx="8" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="58" y="272" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">load_credentials()</text>
  <text x="58" y="290" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">one source per pair · a mixed source is an error</text>
  <text x="58" y="306" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">plain HTTP only for loopback · redirects refused</text>
  <text x="58" y="320" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">so a bearer token cannot be forwarded to another host</text>

  <line x1="226" y1="326" x2="226" y2="352" stroke="#5d6b68" stroke-width="1.3"></line>
  <path d="M 226 352 L 221 344 L 231 344 Z" fill="#5d6b68"></path>

  <rect x="44" y="354" width="390" height="70" rx="8" fill="#fffdf8" stroke="#a8532f"></rect>
  <text x="58" y="376" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">Authorization: Bearer</text>
  <text x="58" y="394" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#a8532f">one header, one token, no fallback</text>
  <text x="58" y="412" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">a profile pull and a publish use the same path</text>

  <path d="M 434 389 L 486 389 L 486 104 L 556 104" fill="none" stroke="#a8532f" stroke-width="1.5"></path>
  <path d="M 556 104 L 548 100 L 548 108 Z" fill="#a8532f"></path>
  <text x="492" y="96" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#a8532f">token only</text>

  <line x1="508" y1="44" x2="508" y2="500" stroke="#a8532f" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.6"></line>
  <text transform="rotate(-90 496 470)" x="496" y="470" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="1.6" fill="#a8532f">boundary</text>

  <rect x="556" y="64" width="356" height="76" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="570" y="86" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1d2b2a">Worker</text>
  <text x="570" y="104" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">a bearer token is either the admin secret, or a</text>
  <text x="570" y="120" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">user token that hashes to a live D1 row</text>
  <text x="570" y="134" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">refused requests touch no catalog data</text>

  <line x1="734" y1="140" x2="734" y2="164" stroke="#5d6b68" stroke-width="1.3"></line>
  <path d="M 734 164 L 729 156 L 739 156 Z" fill="#5d6b68"></path>

  <rect x="556" y="166" width="356" height="94" rx="8" fill="#f1e4d4" stroke="#a8532f"></rect>
  <text x="570" y="186" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#a8532f">ADMIN</text>
  <text x="610" y="186" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">Worker secret, constant-time compare</text>
  <text x="570" y="206" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">no length short-circuit; the whole string is compared</text>
  <text x="570" y="224" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">publish · move the current pointer · rollback</text>
  <text x="570" y="242" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">issue, list, and revoke user tokens</text>

  <rect x="556" y="274" width="356" height="132" rx="8" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="570" y="294" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#0f6b62">USER</text>
  <text x="610" y="294" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">unpdf_ plus 64 hex, shown once</text>
  <text x="570" y="314" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">stored only as HMAC-SHA256(pepper, token)</text>
  <text x="570" y="332" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">looked up by token_hash in D1 · registry_tokens</text>
  <text x="570" y="350" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">last_used_at updated on success</text>
  <text x="570" y="374" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">revoked, unknown, or no header</text>
  <rect x="726" y="378" width="172" height="20" rx="4" fill="#fffdf8" stroke="#0f6b62"></rect>
  <text x="736" y="392" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#0f6b62">401 · no profile bytes</text>

  <rect x="556" y="426" width="356" height="70" rx="8" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="570" y="448" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1d2b2a">Neither path writes the token</text>
  <text x="570" y="466" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">D1 keeps hashes. Revoking one row kills one token;</text>
  <text x="570" y="482" font-family="system-ui, sans-serif" font-size="9.5" fill="#5d6b68">changing the pepper invalidates all of them.</text>

  <text x="44" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#5d6b68">A model provider key is a third credential, used only</text>
  <text x="44" y="470" font-family="system-ui, sans-serif" font-size="11" fill="#5d6b68">by build. It never reaches the extractor or the Worker.</text>
  <text x="44" y="492" font-family="system-ui, sans-serif" font-size="10" fill="#a8532f">nothing in this diagram is a real hostname or token</text>
</svg>
