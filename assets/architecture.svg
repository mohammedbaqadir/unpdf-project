<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Where unpdf keeps its data</title>
  <desc id="arch-desc">Two zones. This machine holds the extractor, the profiler, PDFs, the database, the evidence folder, and a build-only connection to the DeepSeek API. Cloudflare holds the Worker, D1, and KV. Only approved profile bytes cross the boundary, plus page renders sent to DeepSeek during build. No PDF, database, or extracted value crosses.</desc>

  <rect width="960" height="540" fill="#fffdf8"></rect>

  <rect x="24" y="44" width="470" height="420" rx="14" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="44" y="72" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2.2" fill="#a8532f">THIS MACHINE</text>

  <rect x="44" y="90" width="210" height="76" rx="10" fill="#dcefeb" stroke="#0f6b62"></rect>
  <text x="58" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1d2b2a">unpdf-extractor</text>
  <text x="58" y="140" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">deterministic · pull + run</text>

  <rect x="44" y="200" width="210" height="76" rx="10" fill="#f1e4d4" stroke="#c9b9a3"></rect>
  <text x="58" y="228" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1d2b2a">unpdf-profiler</text>
  <text x="58" y="250" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">build + publish · private</text>

  <rect x="44" y="340" width="210" height="76" rx="10" fill="#fffdf8" stroke="#a8532f" stroke-dasharray="5 4"></rect>
  <text x="58" y="368" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d2b2a">DeepSeek API</text>
  <text x="58" y="390" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">page renders · build only</text>

  <rect x="280" y="90" width="190" height="64" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="294" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d2b2a">PDFs</text>
  <text x="294" y="136" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">never leave</text>

  <rect x="280" y="180" width="190" height="64" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="294" y="206" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1d2b2a">&lt;name&gt;.db</text>
  <text x="294" y="226" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">one per job</text>

  <rect x="280" y="270" width="190" height="64" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="294" y="296" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#1d2b2a">.unpdf/</text>
  <text x="294" y="316" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">snapshot · evidence</text>

  <rect x="640" y="44" width="296" height="420" rx="14" fill="#f5f0e6" stroke="#d8d0c0"></rect>
  <text x="660" y="72" font-family="ui-monospace, Consolas, monospace" font-size="10.5" letter-spacing="2.2" fill="#a8532f">CLOUDFLARE</text>

  <rect x="660" y="90" width="256" height="72" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="674" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d2b2a">Worker</text>
  <text x="674" y="138" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">routes · token checks</text>

  <rect x="660" y="190" width="256" height="72" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="674" y="218" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d2b2a">D1</text>
  <text x="674" y="238" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">catalog · token hashes</text>

  <rect x="660" y="290" width="256" height="72" rx="10" fill="#fffdf8" stroke="#d8d0c0"></rect>
  <text x="674" y="318" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1d2b2a">KV</text>
  <text x="674" y="338" font-family="system-ui, sans-serif" font-size="10.5" fill="#5d6b68">immutable profile JSON</text>

  <line x1="567" y1="60" x2="567" y2="470" stroke="#a8532f" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.65"></line>

  <line x1="494" y1="150" x2="632" y2="150" stroke="#a8532f" stroke-width="1.6"></line>
  <path d="M 632 150 L 622 145 L 622 155 Z" fill="#a8532f"></path>
  <rect x="498" y="128" width="80" height="16" fill="#fffdf8"></rect>
  <text x="502" y="140" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#a8532f">approved bytes</text>

  <line x1="640" y1="360" x2="502" y2="360" stroke="#0f6b62" stroke-width="1.6"></line>
  <path d="M 502 360 L 512 355 L 512 365 Z" fill="#0f6b62"></path>
  <rect x="504" y="338" width="74" height="16" fill="#fffdf8"></rect>
  <text x="508" y="350" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#0f6b62">pulled bytes</text>

  <path d="M 154 276 L 154 340" stroke="#a8532f" stroke-width="1.4" stroke-dasharray="4 4"></path>
  <path d="M 154 340 L 149 331 L 159 331 Z" fill="#a8532f"></path>

  <path d="M 280 122 L 262 122" stroke="#5d6b68" stroke-width="1.3"></path>
  <path d="M 254 122 L 262 118 L 262 126 Z" fill="#5d6b68"></path>

  <path d="M 254 150 L 268 150 L 268 212 L 276 212" stroke="#5d6b68" stroke-width="1.3" fill="none"></path>
  <path d="M 280 212 L 270 207 L 270 217 Z" fill="#5d6b68"></path>

  <path d="M 268 212 L 268 302 L 276 302" stroke="#5d6b68" stroke-width="1.3" fill="none"></path>
  <path d="M 280 302 L 270 297 L 270 307 Z" fill="#5d6b68"></path>

  <text x="480" y="508" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#5d6b68">public: extractor   ·   private: profiler, Worker, D1, KV</text>
</svg>
